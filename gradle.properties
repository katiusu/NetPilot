# Project-wide Gradle settings.

# 内存调优：本容器（PRoot，与 Android 宿主共用 RAM）总内存 7.5G 且常驻占用高，
# 原来 -Xmx1536m 会让 Gradle 守护进程被 OOM killer 杀掉（曾观察到
# "Gradle build daemon disappeared unexpectedly"）。降到 1280m 并使用 SerialGC
# 降低 GC 线程与堆外开销。
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC
kotlin.code.style=official
# 关键：in-process 编译，避免再起一个独立 Kotlin 守护进程（本容器内存只够一个 JVM）
kotlin.compiler.execution.strategy=in-process

# 配置缓存
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# 并行配置缓存会额外起线程、加剧内存压力，关掉
org.gradle.configuration-cache.parallel=false

# 关掉 AGP 的 release 资源优化（OptimizeResourcesTask）。
# 根因（已实证）：AGP 9.4.1 用带等号的 `--resource-path-shortening-map=<路径>` 调 aapt2 optimize，
# 而本容器被 android.aapt2FromMavenOverride 强制的 build-tools 36.0.0 aapt2 只认空格形式，
# 于是报 `unknown option` 并非零退出、不产出它声明的 resources-release-optimize.ap_；
# AGP 又不校验 aapt2 退出码与产物存在性，照样写 output-metadata.json 报成功，
# packageRelease 于是打出**没有 AndroidManifest.xml / resources.arsc / res/** 的坏 APK。
# 关掉后 release 直接复用 processReleaseResources 产出的 linked-resources .ap_（完整）；
# 实测资源优化只省 6.4 KB（33,076,005 → 33,069,588 B），不值得为它承担静默坏包的风险。
# 想让优化生效：把 aapt2 指向参数改写壳（本容器已装 /root/aapt2-shim/aapt2）并传
# -Pandroid.enableResourceOptimizations=true，已验证可产出合法 APK。
android.enableResourceOptimizations=false

# 关掉文件系统监视：本容器（PRoot + sdcardfs）inotify 不稳定，偶发
# "Could not create service of type FileHasher … java.io.IOException: Operation not permitted"，
# 导致构建在启动阶段就失败。关掉后改用哈希比对，功能不受影响。
org.gradle.vfs.watch=false
